name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Rebuild the website
    runs-on: ubuntu-latest

    steps:
      - name: Ask the website to rebuild
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN is not set, the website rebuilds once a day."
            exit 0
          fi

          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/TheExeDEV/crater-stats/dispatches \
            -d '{"event_type":"registry-updated"}'
